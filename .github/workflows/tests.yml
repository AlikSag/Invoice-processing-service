name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run state-machine tests
        run: python -m pytest -q
      - name: Check application imports
        env:
          DI_ENDPOINT: https://example.invalid/
          DI_KEY: ci-placeholder
        run: python -c "import app.main; import grpc_client"
